version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Naveen@052002
      POSTGRES_DB: mtbedev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - billing_net

  redis:
    image: redis:7-alpine
    container_name: billing_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - billing_net

volumes:
  postgres_data:
  redis_data:

networks:
  billing_net:
    driver: bridge